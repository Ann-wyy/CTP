# CTP分类模型训练配置 - 高级版
# 适用于正式训练，包含类别不平衡处理、早停等高级特性

# ==================== 数据配置 ====================
csv_file: data_mixed_example.csv
val_split: 0.2
num_classes: 2


# ==================== 模型配置 ====================
# 使用ResNet-50，性能和速度平衡
resnet_type: resnet50

# 使用预训练权重加速收敛
pretrained: true


# ==================== 训练配置 ====================
# 增加训练轮数
epochs: 100

# 批次大小
batch_size: 4

# 较小的学习率，更稳定的训练
lr: 0.0005

# 权重衰减
weight_decay: 0.0001

# 类别权重 - 处理类别不平衡
# 例如：正常样本100个，中风样本30个，比例约3:1
# 给少数类（中风）更大的权重
class_weights: [1.0, 3.0]


# ==================== 早停配置 ====================
# 启用早停，避免过拟合
early_stopping: true

# 验证F1连续15个epoch不提升则停止
patience: 15


# ==================== 其他配置 ====================
# 输出目录（建议每次实验使用不同目录）
output_dir: ./output/advanced_exp

# 增加工作线程数加速数据加载
num_workers: 8

# 随机种子
seed: 42


# ==================== 使用说明 ====================
# 运行命令:
#   python train.py --config config_advanced.yaml
#
# 覆盖某些参数:
#   python train.py --config config_advanced.yaml --epochs 200 --lr 0.0001
#
# 如何计算class_weights:
#   假设有200个样本，标签分布为：
#   - Label 0 (正常): 150个样本
#   - Label 1 (中风): 50个样本
#   比例 = 150:50 = 3:1
#   建议权重 = [1.0, 3.0] 或 [1.0, 150/50] = [1.0, 3.0]
