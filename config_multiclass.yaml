# CTP分类模型训练配置 - 多分类版
# 适用于3类或更多类别的分类任务
# 例如：正常 vs 缺血性中风 vs 出血性中风

# ==================== 数据配置 ====================
csv_file: data_mixed_example.csv
val_split: 0.2

# 分类类别数（3类示例）
# 0 = 正常
# 1 = 缺血性中风
# 2 = 出血性中风
num_classes: 3


# ==================== 模型配置 ====================
resnet_type: resnet50
pretrained: true


# ==================== 训练配置 ====================
epochs: 80
batch_size: 4
lr: 0.001
weight_decay: 0.00001

# 多分类的类别权重
# 假设样本分布：正常=100, 缺血=50, 出血=30
# 计算权重：
#   total = 180
#   weight_0 = total / (3 * 100) = 180 / 300 = 0.6
#   weight_1 = total / (3 * 50) = 180 / 150 = 1.2
#   weight_2 = total / (3 * 30) = 180 / 90 = 2.0
# 归一化后: [0.6, 1.2, 2.0] -> [1.0, 2.0, 3.3]
class_weights: [1.0, 2.0, 3.3]


# ==================== 早停配置 ====================
early_stopping: true
patience: 15


# ==================== 其他配置 ====================
output_dir: ./output/multiclass_exp
num_workers: 4
seed: 42


# ==================== 多分类注意事项 ====================
# 1. CSV文件中的label列应包含 0, 1, 2, ... (num_classes-1)
#
# 2. 计算类别权重的Python代码:
