#    print(f"class_weights: {weights}")
#    ```
#
# 3. 评估指标:
#    - 对于多分类，模型会报告macro-averaged的precision/recall/F1
#    - 混淆矩阵可以看到每个类别的详细表现
#
# 4. 如果某些类别样本非常少:
