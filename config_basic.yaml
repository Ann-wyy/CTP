# CTP分类模型训练配置 - 基础版
# 适用于初次训练，使用默认参数

# ==================== 数据配置 ====================
# CSV数据文件路径（必需）
csv_file: data_mixed_example.csv

# 验证集比例
val_split: 0.2

# 分类类别数（2=二分类，3=三分类，...）
num_classes: 2


# ==================== 模型配置 ====================
# ResNet类型: resnet18, resnet34, resnet50, resnet101, resnet152
resnet_type: resnet50

# 是否使用ImageNet预训练权重（推荐开启）
pretrained: true


# ==================== 训练配置 ====================
# 训练轮数
epochs: 50

# 批次大小（根据GPU显存调整）
batch_size: 4

# 学习率
lr: 0.001

# 权重衰减（L2正则化）
weight_decay: 0.00001

# 类别权重（用于处理类别不平衡，null表示不使用）
# 例如：如果正常:中风=3:1，可以设置为 [1.0, 3.0]
class_weights: null


# ==================== 早停配置 ====================
# 是否启用早停
early_stopping: false

# 早停耐心值（验证F1多少个epoch不提升则停止）
patience: 10


# ==================== 其他配置 ====================
# 输出目录
output_dir: ./output

# DataLoader工作线程数（根据CPU核心数调整）
num_workers: 4

# 随机种子（用于结果可复现）
seed: 42
